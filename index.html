<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1117" />
    <title>Kế hoạch cá nhân 28 ngày</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">28</div>
          <div><strong>Kế hoạch 28 ngày</strong><span>BẢNG ĐIỀU HÀNH</span></div>
        </div>
        <div class="sprint-mini">
          <div class="mini-top"><span>SPRINT 01</span><b id="mini-day">DAY 01 / 28</b></div>
          <div class="mini-progress"><i id="mini-progress"></i></div>
          <div class="mini-bottom"><span id="sprint-dates">28 DAYS</span><span id="mini-percent">0%</span></div>
        </div>
        <nav>
          <p class="nav-label">KHU VỰC LÀM VIỆC</p>
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">▦</span>Tổng quan</button>
          <button class="nav-item" data-view="today"><span class="nav-icon">◷</span>Hôm nay</button>
          <button class="nav-item" data-view="schedule"><span class="nav-icon">⏱</span>Lịch làm việc</button>
          <button class="nav-item" data-view="calendar"><span class="nav-icon">▣</span>Lịch 28 ngày</button>
          <p class="nav-label">CÁC MẢNG MỤC TIÊU</p>
          <button class="nav-item" data-view="se"><span class="track-dot se"></span>Software Engineering</button>
          <button class="nav-item" data-view="ai"><span class="track-dot ai"></span>Artificial Intelligence</button>
          <button class="nav-item" data-view="ielts"><span class="track-dot ielts"></span>IELTS</button>
          <button class="nav-item" data-view="app"><span class="track-dot app"></span>Phát hành App</button>
          <button class="nav-item" data-view="channel"><span class="track-dot channel"></span>Kênh cá nhân</button>
          <button class="nav-item" data-view="jobs"><span class="track-dot jobs"></span>Tìm việc</button>
          <p class="nav-label">THEO DÕI</p>
          <button class="nav-item" data-view="analytics"><span class="nav-icon">◒</span>Phân tích</button>
          <button class="nav-item" data-view="reviews"><span class="nav-icon">✦</span>Tổng kết</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Cài đặt</button>
        </nav>
        <div class="sidebar-foot"><span class="avatar">P</span><div><b>Phương Anh</b><small>Focus mode on</small></div><span class="more">•••</span></div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs"><span>SPRINT 01</span><b>/</b><strong id="page-label">Dashboard</strong></div>
          <div class="top-actions"><button class="icon-btn">⌕</button><button class="icon-btn">♧<i></i></button><button class="today-btn" data-view="today">Mở hôm nay <span>↗</span></button></div>
        </header>
        <div id="view-root"></div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="schedule-engine.js"></script>
    <script src="gemini-ai.js"></script>
    <script src="app.js"></script>
  </body>
</html>

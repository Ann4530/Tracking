<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1117" />
    <title>28-Day Personal Sprint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">28</div>
          <div><strong>Personal Sprint</strong><span>OPERATING SYSTEM</span></div>
        </div>
        <div class="sprint-mini">
          <div class="mini-top"><span>SPRINT 01</span><b id="mini-day">DAY 01 / 28</b></div>
          <div class="mini-progress"><i id="mini-progress"></i></div>
          <div class="mini-bottom"><span id="sprint-dates">28 DAYS</span><span id="mini-percent">0%</span></div>
        </div>
        <nav>
          <p class="nav-label">WORKSPACE</p>
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
          <button class="nav-item" data-view="calendar"><span class="nav-icon">▣</span>Calendar</button>
          <button class="nav-item" data-view="today"><span class="nav-icon">◷</span>Today</button>
          <p class="nav-label">WORKSTREAMS</p>
          <button class="nav-item" data-view="se"><span class="track-dot se"></span>Software Eng.</button>
          <button class="nav-item" data-view="ai"><span class="track-dot ai"></span>Artificial Intel.</button>
          <button class="nav-item" data-view="ielts"><span class="track-dot ielts"></span>IELTS</button>
          <button class="nav-item" data-view="app"><span class="track-dot app"></span>App Launch</button>
          <button class="nav-item" data-view="channel"><span class="track-dot channel"></span>Personal Channel</button>
          <button class="nav-item" data-view="jobs"><span class="track-dot jobs"></span>Job Pipeline</button>
          <p class="nav-label">REFLECT</p>
          <button class="nav-item" data-view="analytics"><span class="nav-icon">◒</span>Analytics</button>
          <button class="nav-item" data-view="reviews"><span class="nav-icon">✦</span>Reviews</button>
          <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
        </nav>
        <div class="sidebar-foot"><span class="avatar">A</span><div><b>Alex</b><small>Focus mode on</small></div><span class="more">•••</span></div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumbs"><span>SPRINT 01</span><b>/</b><strong id="page-label">Dashboard</strong></div>
          <div class="top-actions"><button class="icon-btn">⌕</button><button class="icon-btn">♧<i></i></button><button class="today-btn" data-view="today">Open today <span>↗</span></button></div>
        </header>
        <div id="view-root"></div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
